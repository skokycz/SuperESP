esphome:
  name: esp32d
  friendly_name: ESP32D

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: none
  reboot_timeout: 60s  # Po 60s bez Wi-Fi se ESP restartuje a spustí AP
  
  # Fallback AP hotspot
  ap:
    ssid: "ESP32D-Fallback"
    password: !secret ap_password

# Captive portal pro snadné připojení k fallback AP
captive_portal:
