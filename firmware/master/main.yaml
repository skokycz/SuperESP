esphome:
  name: superesp-master
  friendly_name: "SuperESP Master"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino  # Arduino pro lepší WiFi kompatibilitu

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: none
  output_power: 8.5dB  # Snížený výkon pro stabilitu C3
  reboot_timeout: 0s   # Nikdy se nerestartuje, vždy spustí AP
  ap:
    ssid: "SuperESP-Master"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

# DHT22 senzor na GPIO2
sensor:
  - platform: dht
    pin: GPIO2
    model: DHT22
    temperature:
      name: "Teplota"
      id: temp_sensor
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Vlhkost"
      id: humidity_sensor
      unit_of_measurement: "%"
      accuracy_decimals: 1
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# Status LED
output:
  - platform: gpio
    pin:
      number: GPIO8
      inverted: true
    id: status_led_output

light:
  - platform: binary
    name: "Status LED"
    output: status_led_output
    id: status_led

# Blink při měření
interval:
  - interval: 60s
    then:
      - light.turn_on: status_led
      - delay: 100ms
      - light.turn_off: status_led

# Text sensory pro info
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "MAC Address"
  - platform: version
    name: "ESPHome Version"

binary_sensor:
  - platform: status
    name: "Status"
