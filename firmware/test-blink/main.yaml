esphome:
  name: superesp-test
  friendly_name: "SuperESP Test"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

# API pro Home Assistant
api:
  encryption:
    key: !secret api_key

# OTA aktualizace
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi konfigurace
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Fallback AP mode pokud nelze připojit k WiFi
  ap:
    ssid: "SuperESP Test Fallback"
    password: "superesp123"

# Web server pro debugging
web_server:
  port: 80

# Captive portal pro fallback AP
captive_portal:

# Interní LED pro test (GPIO8 na ESP32-C3 Super Mini)
output:
  - platform: gpio
    pin:
      number: GPIO8
      inverted: true
    id: test_led_output

light:
  - platform: binary
    name: "Test LED"
    output: test_led_output
    id: test_led

# Blink efekt pro vizuální potvrzení
interval:
  - interval: 1s
    then:
      - light.toggle: test_led

# Status sensor pro monitoring
binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "MAC Address"
  
  - platform: version
    name: "ESPHome Version"
